{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <h4 class="mb-4">🎉 Légende générée</h4>

            {% if image_url %}
            <img src="{{ image_url }}" class="img-fluid rounded mb-4" style="max-height: 350px; object-fit: contain;">
            {% endif %}

            <div class="p-3 rounded" style="background: #0f1220; border-left: 4px solid var(--accent); box-shadow: 0 4px 20px rgba(124, 58, 237, 0.15);">
                <p class="fs-5 mb-0 fw-semibold" style="color: #f2f2fa;">{{ legend if legend else "Aucune légende disponible." }}</p>
            </div>

            <a href="/load_image" class="btn btn-outline-light mt-4">🔄 Charger une autre image</a>
        </div>
    </div>
</div>
{% endblock %}
