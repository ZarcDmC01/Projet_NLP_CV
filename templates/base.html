<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP & CV — Annotation d'images</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --grad: linear-gradient(135deg, #7C3AED 0%, #EC4899 55%, #F59E0B 100%);
            --bg: #0b0d17;
            --card: #161a29;
            --card-border: #2d2f4a;
            --accent: #EC4899;
            --accent-2: #7C3AED;
        }

        body {
            background-color: var(--bg);
            color: #e8e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Grosses tâches de couleur floues en fond, purement décoratives */
        body::before, body::after {
            content: "";
            position: fixed;
            width: 45vw;
            height: 45vw;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.28;
            z-index: -1;
            pointer-events: none;
        }
        body::before {
            top: -15vw;
            left: -10vw;
            background: #7C3AED;
        }
        body::after {
            bottom: -15vw;
            right: -10vw;
            background: #F59E0B;
        }

        h1, h2, h3, h4, h5, .navbar-brand {
            font-family: 'Baloo 2', sans-serif;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .navbar { background-color: rgba(22, 26, 41, 0.7); backdrop-filter: blur(8px); border-bottom: 1px solid var(--card-border); }

        .card {
            background-color: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
            animation: fadeInUp .45s ease both;
        }

        .btn {
            border-radius: 0.7rem;
            font-weight: 600;
            transition: transform .18s ease, box-shadow .18s ease, background-position .3s ease;
        }

        .btn-primary {
            background: var(--grad);
            background-size: 200% auto;
            border: none;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
        }
        .btn-primary:hover, .btn-primary:focus {
            background: var(--grad);
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(236, 72, 153, 0.5);
        }
        .btn-primary:disabled {
            background: #3a3d52;
            box-shadow: none;
            transform: none;
        }

        .btn-outline-light:hover { transform: translateY(-2px); }
        .btn-outline-danger:hover { transform: translateY(-2px); }

        .navbar .btn-outline-light {
            border-radius: 2rem;
        }

        .form-control.bg-dark {
            background-color: #0f1220 !important;
            border-radius: 0.7rem;
            border-color: var(--card-border) !important;
            transition: box-shadow .2s ease, border-color .2s ease;
        }
        .form-control.bg-dark:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 0.2rem rgba(236, 72, 153, 0.25);
        }

        .spinner-border.text-primary {
            border-color: var(--accent);
            border-right-color: transparent;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <script>const API_URL = "{{ api_url }}";</script>
    <nav class="navbar navbar-dark px-4 py-3 mb-4">
        <a class="navbar-brand" href="/index">🖼️ NLP & CV</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" href="/load_image">📸 Charger une image</a>
            <a class="btn btn-outline-light btn-sm me-2" href="/legend">📝 Légende</a>
            <span id="nav-auth">
                <a class="btn btn-outline-light btn-sm me-2" href="/login">Connexion</a>
                <a class="btn btn-primary btn-sm" href="/signup">S'inscrire ✨</a>
            </span>
            <span id="nav-user" class="d-none">
                <span class="text-secondary me-3 small" id="nav-username"></span>
                <a class="btn btn-outline-danger btn-sm" href="#" id="logout-btn">Déconnexion</a>
            </span>
        </div>
    </nav>

    <script>
        const token = localStorage.getItem('token');
        const publicPages = ['/login', '/signup'];
        const currentPage = window.location.pathname;

        if (!token && !publicPages.includes(currentPage)) {
            window.location.href = '/login';
        }

        if (token) {
            document.getElementById('nav-auth').classList.add('d-none');
            document.getElementById('nav-user').classList.remove('d-none');
        }

        document.getElementById('logout-btn')?.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            window.location.href = '/login';
        });
    </script>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
