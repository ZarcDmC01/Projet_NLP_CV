name: Auto PR

on:
  push:
    branches: [Jesse, Ning, Moustafa]

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Ouvrir la PR automatiquement
        run: |
          gh pr create \
            --title "Merge ${{ github.ref_name }} → main" \
            --body "CI verte, prêt à merger" \
            --base main \
            --head ${{ github.ref_name }} \
            --repo ${{ github.repository }} || echo "PR déjà existante"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
