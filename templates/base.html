<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP & CV — Annotation d'images</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f1117; color: #e0e0e0; }
        .navbar { background-color: #1a1d27; }
        .card { background-color: #1a1d27; border: 1px solid #2d2f3e; }
        .btn-primary { background-color: #5865f2; border-color: #5865f2; }
        .btn-primary:hover { background-color: #4752c4; border-color: #4752c4; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold" href="/index">NLP & CV</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" href="/load_image">Charger une image</a>
            <a class="btn btn-outline-light btn-sm me-2" href="/legend">Légende</a>
            <span id="nav-auth">
                <a class="btn btn-outline-light btn-sm me-2" href="/login">Connexion</a>
                <a class="btn btn-primary btn-sm" href="/signup">S'inscrire</a>
            </span>
            <span id="nav-user" class="d-none">
                <span class="text-secondary me-3 small" id="nav-username"></span>
                <a class="btn btn-outline-danger btn-sm" href="#" id="logout-btn">Déconnexion</a>
            </span>
        </div>
    </nav>

    <script>
        const token = localStorage.getItem('token');
        const publicPages = ['/login', '/signup'];
        const currentPage = window.location.pathname;

        if (!token && !publicPages.includes(currentPage)) {
            window.location.href = '/login';
        }

        if (token) {
            document.getElementById('nav-auth').classList.add('d-none');
            document.getElementById('nav-user').classList.remove('d-none');
        }

        document.getElementById('logout-btn')?.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            window.location.href = '/login';
        });
    </script>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
